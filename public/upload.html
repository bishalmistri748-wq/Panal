<!DOCTYPE html>
<html>
<head><title>Upload</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div style="max-width:500px; margin:3rem auto; padding:2rem; background:#181d24; border-radius:20px;">
<h2>📤 Upload .so or .zip</h2>
<form action="/api/upload" method="post" enctype="multipart/form-data">
  <input type="file" name="mod_file" required style="width:100%; padding:1rem; background:#0b0d10; color:white; border:1px solid #2a2f36; border-radius:10px;">
  <button type="submit" style="margin-top:1rem; padding:0.8rem 2rem; background:#f0b34b; border:none; border-radius:30px; font-weight:bold;">Upload</button>
</form>
<a href="/">⬅ Back</a>
</div>
</body>
</html>
